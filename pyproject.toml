[project]
name = "torch-neuronx"
dynamic = ["version"]
description = "Neuron Backend for PyTorch"
authors = [{name = "AWS Neuron Team"}]
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch~=2.11.0",
    "numpy<2; python_version < '3.12'",
    "numpy>=2; python_version >= '3.12'",
    "grpcio-tools",
    "wheel",
]

[project.scripts]
neuron-numa-launch = "torch_neuronx.numa:numa_launch_main"

[project.entry-points."torch.backends"]
torch_neuronx = "torch_neuronx:_autoload"

[project.entry-points."torch_dynamo_backends"]
neuron = "torch_neuronx.neuron_dynamo_backend.backend:neuron_backend"

[build-system]
requires = ["setuptools", "wheel", "torch", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "expecttest>=0.3.0",
    "hypothesis",
    "ninja>=1.11.1.4",
    "pytest",
    "pytest-xdist",
    "pytest-html",
    "pytest-cov",
    "pytest-json-report",
    "pytest-timeout",
    "pytest-shard",
    "ruff>=0.8.0",
    "pyzstd",
    "pytest-forked",
    "PyYAML",
    "multiprocess",
]

docs = [
    "sphinx>=8.0",
    "sphinx-book-theme",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".eggs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["S101", "F401"]  # Allow assert and unused imports in tests (torch_neuronx needs to be imported for side effects)
"examples/**/*" = ["F401"]  # Allow unused imports in examples for side effects

[tool.mypy]
python_version = "3.12"
files = ["torch_neuronx"]
ignore_missing_imports = true
no_error_summary = true

# Files with large numbers of existing errors; remove as they are cleaned up.
[[tool.mypy.overrides]]
ignore_errors = true
