name: Seed NEFF Cache

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:
  # TEST-ONLY on contribute-9.9: manual runs need the file on the default branch.
  push:
    branches: [contribute-9.9]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-tests-image:
    name: Build the tests image
    if: vars.NEFF_CACHE_SEED_ENABLED == 'true'
    runs-on: [
      self-hosted,
      linux,
      neuron.build-nightly-image,
      "neuron.run-${{ github.run_id }}-build-tests-image",
      "neuron.dockerfile:Dockerfile.nightly-test",
      "neuron.base-image:684844594039.dkr.ecr.us-west-2.amazonaws.com/neuron-image-builder-public:torch-neuronx-main-nightly-base-stable",
      "neuron.build-arg:PYTORCH_CHANNEL:stable"
    ]
    timeout-minutes: 60
    outputs:
      image: ${{ steps.wait.outputs.image_uri }}
    steps:
      - name: Wait for the tests image
        id: wait
        run: |
          set -eo pipefail
          /opt/neuron-ci/wait-for-nightly-image.sh | tee /tmp/image-output.log
          IMAGE_URI=$(grep "Nightly base image ready:" /tmp/image-output.log | sed 's/.*ready: //')
          echo "Tests image ready: $IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  tests:
    name: Nightly tests
    needs: [build-tests-image]
    uses: ./.github/workflows/_reusable-full-wheel-tests.yml
    with:
      suite_id: seed
      image: ${{ needs.build-tests-image.outputs.image }}
      refresh_neff_cache: true
      dkms: ''
      # TEST-ONLY on contribute-9.9: one upstream node instead of 20.
      upstream_smoke_only: true
