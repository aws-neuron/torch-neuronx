name: PR Checks
on:
  pull_request_review:
    types: [submitted]
  # A rebase/merge-from-main changes the head SHA but keeps the approval.
  # synchronize re-runs the suite on the new SHA (gate checks approval via API).
  pull_request:
    types: [synchronize]
  # A fork pull request gets no automatic run. A maintainer adds the
  # safe-to-test label, and ci-approved-dispatch.yml starts this workflow with
  # the two inputs below. Leave both empty for a normal manual run.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Fork pull request number. Leave empty for a normal manual run.
        required: false
        type: string
        default: ''
      head_sha:
        description: Full head commit of the fork pull request that you reviewed.
        required: false
        type: string
        default: ''
  # Required checks must report on the merge-group commit too, else the queue
  # hangs. They ran for real on the PR head; here they no-op pass (see jobs).
  merge_group:
    types: [checks_requested]
    branches: [main, 'contribute-*']
permissions:
  contents: read
  id-token: write
  pull-requests: read  # gate reads PR reviews
# Fork pull request runs get their own group. They start on the base branch,
# so github.sha is the same for every fork pull request on that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (inputs.pr_number && format('manual-{0}', inputs.pr_number)) || github.sha }}
  cancel-in-progress: true
env:
  AWS_DEFAULT_REGION: us-west-2
jobs:
  # Determines whether the suite should run. Checks approval state via API
  # so we don't need the ciflow:approved label or a separate labeler workflow.
  check-approval:
    runs-on: [self-hosted, linux, "neuron.image:neuron-gate-tools", "neuron.run-${{ github.run_id }}-check-approval"]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write  # pending status on a fork pull request
    outputs:
      run: ${{ steps.check.outputs.run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      pr_build_os: ${{ steps.config.outputs.pr_build_os }}
      pr_ubuntu_codename: ${{ steps.config.outputs.ubuntu_codename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read the PR Ubuntu version
        id: config
        uses: ./.github/actions/read-pr-ubuntu
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            // merge_group and a manual run without a pull request always run.
            const prInput = (context.payload.inputs || {}).pr_number || '';
            if (context.eventName === 'merge_group' || (context.eventName === 'workflow_dispatch' && !prInput)) {
              core.setOutput('run', 'true');
              return;
            }
            // A manual run for a fork pull request. Run only the commit that a
            // maintainer reviewed and labelled.
            if (context.eventName === 'workflow_dispatch') {
              const headSha = context.payload.inputs.head_sha || '';
              if (!/^[1-9][0-9]*$/.test(prInput) || !/^[0-9a-f]{40}$/.test(headSha)) {
                core.setFailed('Give the pull request number and its full 40-character head commit.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(prInput) });
              const branch = context.ref.replace('refs/heads/', '');
              if (pr.state !== 'open') {
                core.setFailed(`PR #${prInput} is not open.`);
              } else if (pr.base.ref !== branch) {
                core.setFailed(`PR #${prInput} targets ${pr.base.ref}. Start the run on that branch.`);
              } else if (!pr.labels.some(l => l.name === 'safe-to-test')) {
                core.setFailed(`PR #${prInput} does not have the safe-to-test label.`);
              } else if (pr.head.sha !== headSha) {
                core.setFailed(`PR #${prInput} changed after the review. Review ${pr.head.sha}, then add the safe-to-test label again.`);
              } else {
                await github.rest.repos.createCommitStatus({
                  ...context.repo, sha: headSha, state: 'pending', context: 'PR Checks',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                });
                core.setOutput('run', 'true');
                core.setOutput('pr_number', prInput);
                core.setOutput('head_sha', headSha);
              }
              return;
            }
            // A fork pull request runs only through the safe-to-test dispatch above.
            const head = context.payload.pull_request.head.repo || {};
            if (head.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setOutput('run', 'false');
              return;
            }
            const draft = context.payload.pull_request.draft;
            // A release base can also be a publication test branch, such as
            // e2e/release-publication/<id>/release-N.M.
            const release = /(^|\/)release-/.test(context.payload.pull_request.base.ref);
            const skip = (context.payload.pull_request.labels || []).some(l => l.name === 'ciflow:skip-pr-checks');
            // pull_request_review: only run on actual approval.
            // Comments will cancel the in-flight suite (unavoidable with
            // cancel-in-progress) but will NOT restart — same as before.
            if (context.eventName === 'pull_request_review') {
              const approved = context.payload.review.state === 'approved';
              core.setOutput('run', String(approved && !draft && !release && !skip));
              return;
            }
            // pull_request [synchronize]: rebase/merge-from-main.
            // Check if PR currently has an approval via API.
            const reviews = await github.rest.pulls.listReviews({
              ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const latestByUser = new Map();
            for (const r of reviews.data) {
              if (r.state === 'COMMENTED') continue;
              latestByUser.set(r.user.id, r.state);
            }
            const approved = [...latestByUser.values()].includes('APPROVED');
            core.setOutput('run', String(approved && !draft && !release && !skip));
  # Publish one commit status for each job of this run on the pull request head
  # commit. A fork pull request run starts on the base branch, so GitHub does
  # not attach the jobs to the pull request. Only the PR Checks rollup links the
  # two. A commit status target_url is kept, so each status links to its own job
  # log. A check run details_url is replaced by GitHub, so a status is correct
  # here and a check run is not.
  report-job-status:
    name: Report job status
    # The fork path only. On the other paths the run head_sha is the pull
    # request head, so GitHub attaches the jobs and these statuses would be
    # duplicates.
    if: github.event_name == 'workflow_dispatch' && needs.check-approval.outputs.pr_number != ''
    needs: check-approval
    runs-on: [self-hosted, linux, "neuron.image:neuron-gate-tools", "neuron.run-${{ github.run_id }}-report-job-status"]
    timeout-minutes: 560
    permissions:
      statuses: write
      actions: read
    steps:
      # Keep this best effort. The report is cosmetic and must not fail a run
      # that passed. report-to-pr posts the final state of each job, so a lost
      # loop cannot leave a status at pending.
      - continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.check-approval.outputs.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const runId = context.runId;

            // The jobs API returns the display name. A job with no `name:` key
            // reports its id, so check-approval and report-to-pr appear under
            // their ids. Exclude all three: this job would report itself,
            // report-to-pr runs after the loop, and check-approval is a gate,
            // not a test.
            const SKIP = new Set(['Report job status', 'report-to-pr', 'check-approval']);

            const POLL_MS = 30000;
            // internal-tests and block-perf carry neuron.timeout:32400, which is
            // 540 minutes. A shorter deadline freezes every row at pending for
            // hours and leaves report-to-pr to correct them at the end.
            const DEADLINE = Date.now() + 550 * 60 * 1000;

            // A commit status has four states. There is no neutral state and no
            // skipped state. A skipped job gets no row at all. torch-mlir-e2e-tests
            // has `if: false`, so a skipped job mapped to success would show a
            // disabled suite as a passing check.
            const reportable = (job) => job.conclusion !== 'skipped';
            const stateOf = (job) => {
              if (job.status !== 'completed') return 'pending';
              if (job.conclusion === 'success') return 'success';
              if (job.conclusion === 'cancelled') return 'error';
              return 'failure';
            };

            // Keep the full "Parent / Child" name. internal-tests and block-perf
            // call different reusable workflows, so two child jobs can have the
            // same name. A short name would make them share one status context.
            const last = new Map();

            for (;;) {
              let jobs = [];
              try {
                const { data } = await github.rest.actions.listJobsForWorkflowRun({
                  ...context.repo, run_id: runId, per_page: 100,
                });
                jobs = data.jobs.filter((j) => !SKIP.has(j.name) && reportable(j));
              } catch (err) {
                core.warning(`The jobs API failed: ${err.status} ${err.message}`);
              }

              for (const job of jobs) {
                const state = stateOf(job);
                const description = String(job.status !== 'completed' ? job.status : job.conclusion).slice(0, 140);
                const key = `${state}|${description}`;
                if (last.get(job.name) === key) continue;
                try {
                  await github.rest.repos.createCommitStatus({
                    ...context.repo, sha: headSha, context: job.name, state, description,
                    target_url: job.html_url,
                  });
                  last.set(job.name, key);
                  core.info(`${job.name} is ${state} (${description})`);
                } catch (err) {
                  core.warning(`The status post failed for "${job.name}": ${err.status} ${err.message}`);
                }
              }

              if (jobs.length > 0 && jobs.every((j) => j.status === 'completed')) break;
              if (Date.now() > DEADLINE) {
                core.warning('The deadline passed. report-to-pr posts the final state.');
                break;
              }
              await new Promise((r) => setTimeout(r, POLL_MS));
            }

  internal-tests:
    needs: [check-approval]
    if: needs.check-approval.outputs.run == 'true'
    name: Internal tests
    uses: ./.github/workflows/_reusable-internal-tests.yml
    with:
      build_image: true
      pr_number: ${{ github.event.pull_request.number || needs.check-approval.outputs.pr_number || '' }}
      build_os: ${{ needs.check-approval.outputs.pr_build_os }}
      ubuntu_codename: ${{ needs.check-approval.outputs.pr_ubuntu_codename }}
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      noop: ${{ github.event_name == 'merge_group' }}
      dkms: public

  block-perf:
    needs: [check-approval]
    if: needs.check-approval.outputs.run == 'true'
    uses: ./.github/workflows/_reusable-block-perf.yml
    with:
      runner-labels: ${{ format('["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.internal_compute.persistent-storage:read","neuron.build-image","neuron.build-os:{2}","neuron.build-arg:UBUNTU_CODENAME:{3}","neuron.run-{0}-block-perf","neuron.pr:{1}","neuron.timeout:32400","neuron.dkms:public"]', github.run_id, github.event.pull_request.number || needs.check-approval.outputs.pr_number, needs.check-approval.outputs.pr_build_os, needs.check-approval.outputs.pr_ubuntu_codename) }}
      artifact-prefix: block-perf
      enforce-mfu-threshold: true
      checkout-ref: ${{ github.event.pull_request.head.sha }}
      noop: ${{ github.event_name == 'merge_group' }}

  # Fork pull request runs only. A manual run reports on the base branch, so
  # post the result on the pull request head commit.
  report-to-pr:
    needs: [check-approval, internal-tests, block-perf]
    if: always() && needs.check-approval.outputs.pr_number != ''
    runs-on: [self-hosted, linux, "neuron.image:neuron-gate-tools", "neuron.run-${{ github.run_id }}-report-to-pr"]
    timeout-minutes: 10
    permissions:
      statuses: write
      actions: read
    steps:
      # Post the final state of each job before the rollup. report-job-status
      # polls, so a lost runner or a passed deadline can leave a status at
      # pending. A pending status on a pull request reads as a check that never
      # ends.
      - name: Report the final job states
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.check-approval.outputs.head_sha }}
        with:
          script: |
            const SKIP = new Set(['Report job status', 'report-to-pr', 'check-approval']);
            // See report-job-status: a skipped job gets no row.
            const reportable = (job) => job.conclusion !== 'skipped';
            const stateOf = (job) => {
              if (job.status !== 'completed') return 'pending';
              if (job.conclusion === 'success') return 'success';
              if (job.conclusion === 'cancelled') return 'error';
              return 'failure';
            };
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            for (const job of data.jobs.filter((j) => !SKIP.has(j.name) && reportable(j))) {
              try {
                await github.rest.repos.createCommitStatus({
                  ...context.repo, sha: process.env.HEAD_SHA, context: job.name,
                  state: stateOf(job),
                  description: String(job.conclusion || job.status).slice(0, 140),
                  target_url: job.html_url,
                });
              } catch (err) {
                core.warning(`The status post failed for "${job.name}": ${err.status} ${err.message}`);
              }
            }

      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.check-approval.outputs.head_sha }}
          STATE: ${{ needs.internal-tests.result == 'success' && needs.block-perf.result == 'success' && 'success' || 'failure' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: process.env.STATE, context: 'PR Checks',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
