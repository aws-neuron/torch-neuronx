name: PR Checks

# Runs the internal test suites on a pull request.
#
# pr-test-dispatcher.yml starts this workflow. You can also start it manually.
#
# This workflow defines no test suites. _reusable-internal-tests.yml holds the
# single suite matrix, and each suite declares the sets it belongs to. Add a new
# suite there, not here.
#
# The commit status context stays "Smoke Test". pr-gate.yml posts the pending
# status under the same name. Branch protection refers to it. Rename both files
# together, or the pending status does not clear.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number being tested'
        required: true
        type: string
      head_sha:
        description: 'HEAD SHA of the PR branch'
        required: true
        type: string
      test_set:
        description: 'Which suite set to run. See _reusable-internal-tests.yml.'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - ci
          - full
      image_uri:
        description: 'Pre-built ECR image. Empty builds the image from NeuronGithubCIConfig.'
        required: false
        default: ''
        type: string
  # A required check must also report on the merge-group commit. If it does not,
  # the queue hangs. The suites ran for real on the PR head, so they pass here
  # as a no-op.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-west-2

jobs:
  set-pending:
    name: Report pending
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
          TEST_SET: ${{ github.event.inputs.test_set }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'Smoke Test',
              description: `Running PR checks (${process.env.TEST_SET} set)...`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  internal-tests:
    name: Internal tests
    uses: ./.github/workflows/_reusable-internal-tests.yml
    with:
      test_set: ${{ github.event.inputs.test_set || 'pr' }}
      # An empty image_uri builds the image from NeuronGithubCIConfig. A set
      # image_uri skips the build and runs the given image.
      build_image: ${{ github.event.inputs.image_uri == '' }}
      image: ${{ github.event.inputs.image_uri || '' }}
      pr_number: ${{ github.event.inputs.pr_number || '' }}
      checkout_ref: ${{ github.event.inputs.head_sha || github.sha }}
      noop: ${{ github.event_name == 'merge_group' }}

  block-perf:
    name: Block perf
    uses: ./.github/workflows/_reusable-block-perf.yml
    with:
      runner-labels: ${{ github.event_name == 'merge_group' && '["ubuntu-latest"]' || format('["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.build-image","neuron.run-{0}-block-perf","neuron.pr:{1}","neuron.timeout:32400"]', github.run_id, github.event.inputs.pr_number) }}
      artifact-prefix: block-perf
      # This fleet has no MFU baseline yet. Measure and report, but do not gate.
      # Set this to true after the goldens exist.
      enforce-mfu-threshold: false
      checkout-ref: ${{ github.event.inputs.head_sha || github.sha }}
      noop: ${{ github.event_name == 'merge_group' }}

  report-status:
    name: Report status
    needs: [internal-tests, block-perf]
    if: always() && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
          TEST_SET: ${{ github.event.inputs.test_set }}
          TESTS_RESULT: ${{ needs.internal-tests.result }}
          PERF_RESULT: ${{ needs.block-perf.result }}
        with:
          script: |
            // One status covers the whole run. Per-suite statuses would not match
            // the single "Smoke Test" context that pr-gate.yml posts.
            const bad = ['failure', 'cancelled', 'timed_out'];
            const tests = process.env.TESTS_RESULT;
            const perf = process.env.PERF_RESULT;
            const ok = !bad.includes(tests) && !bad.includes(perf);
            const set = process.env.TEST_SET;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: ok ? 'success' : 'failure',
              context: 'Smoke Test',
              description: ok
                ? `PR checks passed (${set} set)`
                : `PR checks failed (${set} set): tests=${tests} block-perf=${perf}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
