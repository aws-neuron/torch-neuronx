name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-west-2

jobs:
  smoke-test:
    name: "Smoke Test — PR #${{ github.event.pull_request.number }}"
    runs-on:
      - self-hosted
      - linux
      - neuron
      - neuron.internal_compute
      - "neuron.internal_compute:trn2.48xlarge"
      - neuron.build-image
      - "neuron.run-${{ github.run_id }}-smoke-test"
      - "neuron.pr:${{ github.event.pull_request.number }}"
    timeout-minutes: 30
    steps:
      - name: Set status to in-progress
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'Smoke Test',
              description: 'Running smoke test...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Smoke test
        run: |
          echo "========================================="
          echo "Smoke Test — PR #${{ github.event.pull_request.number }}"
          echo "========================================="
          echo "Running on internal compute (Neuron hardware)"
          python3 -c "import sys; print(f'Python {sys.version}')"
          echo "========================================="
          echo "✓ Smoke test passed!"
          echo "========================================="

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'Smoke Test',
              description: 'Smoke test passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'Smoke Test',
              description: 'Smoke test failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
