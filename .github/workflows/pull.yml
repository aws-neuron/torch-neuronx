name: PR Checks

# Triggered by pr-test-dispatcher.yml or manually via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number being tested'
        required: true
        type: string
      head_sha:
        description: 'HEAD SHA of the PR branch'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: "Smoke Test — PR #${{ github.event.inputs.pr_number }}"
    runs-on:
      - self-hosted
      - linux
      - neuron
    timeout-minutes: 30
    steps:
      - name: Set status to in-progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'pending',
              context: 'Smoke Test',
              description: 'Running smoke test...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_sha }}

      - name: Smoke test
        run: |
          echo "============================================="
          echo "  Smoke Test"
          echo "  PR: #${{ github.event.inputs.pr_number }}"
          echo "  SHA: ${{ github.event.inputs.head_sha }}"
          echo "  Runner: $(hostname)"
          echo "============================================="
          echo "Smoke test passed ✓"

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'success',
              context: 'Smoke Test',
              description: 'Smoke test passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'failure',
              context: 'Smoke Test',
              description: 'Smoke test failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
