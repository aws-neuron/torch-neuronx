name: PR Checks

# Triggered by pr-test-dispatcher.yml or manually via workflow_dispatch.
# Only runs ATen upstream tests for external contributor PRs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number being tested'
        required: true
        type: string
      head_sha:
        description: 'HEAD SHA of the PR branch'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-west-2
  # ── Dry-run toggle ──────────────────────────────────────────
  # Set to "true" to run a dummy test on ubuntu-latest instead of
  # real ATen tests on neuron hardware. Remove (or set to "false")
  # once the self-hosted runner image is ready.
  DRY_RUN: "true"

jobs:
  aten-unit-tests:
    name: "ATen Unit Tests (trn2) — PR #${{ github.event.inputs.pr_number }}"
    runs-on: ${{ fromJSON(
      env.DRY_RUN == 'true'
        && '["ubuntu-latest"]'
        || '["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.build-image","neuron.run-' + github.run_id + '-aten-unit-tests","neuron.pr:' + github.event.inputs.pr_number + '"]'
      ) }}
    timeout-minutes: 240
    steps:
      - name: Set status to in-progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'pending',
              context: 'ATen Unit Tests (trn2)',
              description: 'Running ATen unit tests...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_sha }}

      # ── Dry-run: dummy test ──────────────────────────────────
      - name: Dummy test (dry-run)
        if: env.DRY_RUN == 'true'
        run: |
          echo "============================================="
          echo "  DRY RUN — skipping real ATen tests"
          echo "  PR: #${{ github.event.inputs.pr_number }}"
          echo "  SHA: ${{ github.event.inputs.head_sha }}"
          echo "============================================="
          echo "Listing checked-out files:"
          ls -la
          echo ""
          echo "Dummy test passed ✓"

      # ── Real test: neuron hardware ───────────────────────────
      - name: Run ATen tests
        if: env.DRY_RUN != 'true'
        uses: ./.github/actions/run-test-suite
        with:
          test-command: ./tools/run-test-parallel --skip-distributed --skip_pt_test_distributed --coverage --json-report --report-dir=outputs/test-reports
          artifact-name: aten-test-results-pr-${{ github.event.inputs.pr_number }}

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'success',
              context: 'ATen Unit Tests (trn2)',
              description: 'ATen unit tests passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.inputs.head_sha }}',
              state: 'failure',
              context: 'ATen Unit Tests (trn2)',
              description: 'ATen unit tests failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
