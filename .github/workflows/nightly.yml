name: Nightly Base Image Build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-base:
    name: Build Nightly Base Image
    runs-on:
      - self-hosted
      - linux
      - neuron.build-nightly-image
      - "neuron.dockerfile:Dockerfile.base-dependencies"
      - "neuron.run-${{ github.run_id }}-build-base"
    outputs:
      base_image: ${{ steps.wait.outputs.image_uri }}
    steps:
      - name: Wait for nightly base image
        id: wait
        run: |
          /opt/neuron-ci/wait-for-nightly-image.sh | tee /tmp/nightly-output.log
          IMAGE_URI=$(grep "Nightly base image ready:" /tmp/nightly-output.log | sed 's/.*ready: //')
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  promote-to-stable:
    name: Tag Base Image as Stable
    needs: [build-base]
    runs-on:
      - self-hosted
      - linux
      - neuron.tag-nightly-stable
      - "neuron.run-${{ github.run_id }}-promote-to-stable"
      - "neuron.nightly-image:${{ needs.build-base.outputs.base_image }}"
    steps:
      - name: Verify stable tag
        env:
          NIGHTLY_IMAGE_URI: ${{ needs.build-base.outputs.base_image }}
        run: |
          /opt/neuron-ci/verify-stable-tag.sh
          echo "✓ Base image tagged as stable"
