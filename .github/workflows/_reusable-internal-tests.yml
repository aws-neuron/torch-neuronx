name: Internal Tests

on:
  workflow_call:
    inputs:
      suite_id:
        description: Test suite identifier.
        required: false
        type: string
        default: internal
      image:
        description: Complete image URI.
        required: false
        type: string
        default: ''
      build_image:
        description: Build an image from the checked-out source.
        required: false
        type: boolean
        default: false
      pr_number:
        description: Pull request number for a build image.
        required: false
        type: string
        default: ''
      head_sha:
        description: >-
          Commit to build the image from. A dispatched fork run starts on the base
          branch, so the webhook sees the base tip. Without this the image holds
          the base branch and the suite reports a pass on the pull request. Empty
          adds no neuron.sha label, so the image holds the payload commit.
        required: false
        type: string
        default: ''
      build_os:
        description: Operating system label for a build image.
        required: false
        type: string
        default: ''
      ubuntu_codename:
        description: Ubuntu codename for a build image.
        required: false
        type: string
        default: ''
      checkout_ref:
        description: Git reference to check out.
        required: false
        type: string
        default: ''
      refresh_neff_cache:
        description: Refresh the shared NEFF cache.
        required: false
        type: boolean
        default: false
      noop:
        description: Pass the tests without a test run.
        required: false
        type: boolean
        default: false
      dkms:
        description: Value of the neuron.dkms runner label. Empty uses the branch config pin.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  define-matrix:
    runs-on: [self-hosted, linux, "neuron.image:neuron-gate-tools", "neuron.run-${{ github.run_id }}-${{ inputs.suite_id }}-define-matrix"]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - if: ${{ inputs.build_image && inputs.build_os == '' }}
        run: echo "build_os is required when build_image is true." && exit 1
      - if: ${{ inputs.build_image && inputs.ubuntu_codename == '' }}
        run: echo "ubuntu_codename is required when build_image is true." && exit 1
      # Step env does not reach run steps on this runner, so set the variable inline.
      - id: matrix
        run: DIST_CONFIG=internal_test_distribution_config.json python3 tests/pytorch_tests_native/runner/emit_upstream_matrix.py

  test:
    needs: define-matrix
    name: ${{ matrix.label }}
    env:
      MATRIX_LABEL: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    runs-on: >-
      ${{ inputs.noop && fromJSON(format(
      '["self-hosted","linux","neuron.image:neuron-gate-tools","neuron.run-{0}-{1}-noop-{2}"]',
      github.run_id, inputs.suite_id, matrix.node)) || inputs.build_image &&
      fromJSON(format(
      '["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.build-image","neuron.build-os:{5}","neuron.build-arg:UBUNTU_CODENAME:{6}","neuron.run-{0}-{1}","neuron.pr:{2}","neuron.timeout:32400"{3}{4}{7}]',
      github.run_id,
      matrix.node,
      inputs.pr_number,
      matrix.neff_cache && ',"neuron.internal_compute.persistent-storage:read"' || '',
      inputs.dkms != '' && format(',"neuron.dkms:{0}"', inputs.dkms) || '',
      inputs.build_os,
      inputs.ubuntu_codename,
      inputs.head_sha != '' && format(',"neuron.sha:{0}"', inputs.head_sha) || ''
      )) || fromJSON(format(
      '["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.run-{0}-{1}-{2}","neuron.image:{3}","neuron.timeout:32400"{4}{5}]',
      github.run_id,
      inputs.suite_id,
      matrix.node,
      inputs.image,
      matrix.neff_cache && format(
      ',"neuron.internal_compute.persistent-storage:{0}"',
      inputs.refresh_neff_cache && 'write' || 'read'
      ) || '',
      inputs.dkms != '' && format(',"neuron.dkms:{0}"', inputs.dkms) || ''
      )) }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.noop }}
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/run-test-suite
        if: ${{ !inputs.noop }}
        with:
          # A shared-process run needs a longer per-test timeout than an upstream test.
          test-command: >-
            ${{ format(
            'GITHUB_REF_NAME={0} TEST_TIMEOUT=1800 python3 tests/pytorch_tests_native/runner/run_upstream_tests.py --node {1} --output-dir outputs/test-reports{2}{3}',
            github.ref_name,
            matrix.node,
            matrix.neff_cache && ' --download-neff-cache' || '',
            !inputs.build_image && matrix.neff_cache && inputs.refresh_neff_cache && ' --refresh-neff-cache' || ''
            ) }}
          artifact-name: ${{ inputs.suite_id }}-${{ matrix.node }}-results
          summary-path: test-results/outputs/test-reports/step_summary.md
      - name: Merge-queue no-op
        if: ${{ inputs.noop }}
        run: echo "The tests ran on the pull request head. Pass this merge queue check."

  cpp-lit-accuracy:
    name: C++, MLIR LIT, Op-Accuracy Tests
    env:
      MATRIX_LABEL: cpp-lit-accuracy
    runs-on: >-
      ${{ inputs.noop && fromJSON(format(
      '["self-hosted","linux","neuron.image:neuron-gate-tools","neuron.run-{0}-{1}-noop-{2}"]',
      github.run_id, inputs.suite_id, 'cpp-lit-accuracy')) || inputs.build_image &&
      fromJSON(format(
      '["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.build-image","neuron.build-os:{3}","neuron.build-arg:UBUNTU_CODENAME:{4}","neuron.run-{0}-cpp-lit-accuracy","neuron.pr:{1}","neuron.timeout:32400"{2}{5}]',
      github.run_id,
      inputs.pr_number,
      inputs.dkms != '' && format(',"neuron.dkms:{0}"', inputs.dkms) || '',
      inputs.build_os,
      inputs.ubuntu_codename,
      inputs.head_sha != '' && format(',"neuron.sha:{0}"', inputs.head_sha) || ''
      )) || fromJSON(format(
      '["self-hosted","linux","neuron","neuron.internal_compute","neuron.internal_compute:trn2.48xlarge","neuron.run-{0}-{1}-cpp-lit-accuracy","neuron.image:{2}","neuron.timeout:32400"{3}]',
      github.run_id,
      inputs.suite_id,
      inputs.image,
      inputs.dkms != '' && format(',"neuron.dkms:{0}"', inputs.dkms) || ''
      )) }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.noop }}
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # Run all of the suites. Then fail if one of them failed.
      - uses: ./.github/actions/run-test-suite
        if: ${{ !inputs.noop }}
        with:
          test-command: |
            mkdir -p outputs/accuracy outputs/test-reports
            # C++ and MLIR LIT write no JSON report, so record a pass/fail row
            # for each command. Otherwise a failure is not visible in the
            # summary. Write the rows to a separate file. The accuracy test
            # writes its own step_summary.md, so do not share that file.
            rows=outputs/command-status.md
            {
              echo "## Test results: C++, MLIR LIT, Op-Accuracy"
              echo ""
              echo "| command | status |"
              echo "|---|---|"
            } > "$rows"
            rc=0
            ./tools/run-cpp-test --verbose \
              && echo "| C++ tests | PASS |" >> "$rows" \
              || { echo "| C++ tests | FAIL |" >> "$rows"; rc=1; }
            ./tools/run-torch-mlir-lit-tests \
              && echo "| MLIR LIT tests | PASS |" >> "$rows" \
              || { echo "| MLIR LIT tests | FAIL |" >> "$rows"; rc=1; }
            TORCH_NEURONX_FALLBACK_ONLY_FOR_UNIMPLEMENTED_OPS=1 NEURON_ACCURACY_OUTPUT_DIR=outputs/accuracy python -m pytest tests/vertical/accuracy/test_accuracy.py --traced-model qwen3_235b_ep64_tp4 --max-shapes-per-op 0 -n 16 --dist load --json-report --json-report-file=outputs/test-reports/accuracy.json --tb=short -q \
              && echo "| Op-accuracy tests | PASS |" >> "$rows" \
              || { echo "| Op-accuracy tests | FAIL |" >> "$rows"; rc=1; }
            # Put the command table on top, then the accuracy detail summary.
            summary=outputs/accuracy/step_summary.md
            { cat "$rows"; echo; [ -f "$summary" ] && cat "$summary"; } > outputs/combined-summary.md
            mv outputs/combined-summary.md "$summary"
            exit $rc
          artifact-name: ${{ inputs.suite_id }}-cpp-lit-accuracy-results
          summary-path: test-results/outputs/accuracy/step_summary.md
      - name: Merge-queue no-op
        if: ${{ inputs.noop }}
        run: echo "The tests ran on the pull request head. Pass this merge queue check."
