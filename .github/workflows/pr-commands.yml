name: PR commands

# A maintainer comments /test on a fork pull request to start PR Checks.
#
# GitHub runs comment events from the default branch of this repository, so a
# fork cannot change this file. This workflow does not check out code. It:
#   1. checks that the commenter has write access,
#   2. adds the safe-to-test label,
#   3. starts pull.yml on the pull request's base branch, pinned to the current
#      head commit. pull.yml checks the label and the commit again.
#
# Pull requests from branches in this repository run PR Checks on approval.
# /test does nothing for them.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    # Skip other comments without a runner.
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    permissions:
      actions: write        # start pull.yml
      issues: write         # react to the comment
      pull-requests: write  # add the safe-to-test label
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            if (comment.body.trim() !== '/test') return;

            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: comment.user.login,
            });
            if (!['admin', 'write'].includes(access.permission)) {
              core.notice(`${comment.user.login} does not have write access. Ignoring /test.`);
              return;
            }

            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.head.repo && pr.head.repo.full_name === thisRepo) {
              core.notice(`PR #${prNumber} is not from a fork. PR Checks start on approval.`);
              return;
            }
            if (!pr.base.ref.startsWith('contribute-')) {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}. Fork pull requests must target a contribute-N.M branch.`);
              return;
            }

            await github.rest.issues.addLabels({ ...context.repo, issue_number: prNumber, labels: ['safe-to-test'] });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'pull.yml', ref: pr.base.ref,
              inputs: { pr_number: String(prNumber), head_sha: pr.head.sha },
            });
            await github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: comment.id, content: 'rocket' });
            core.notice(`Started PR Checks for PR #${prNumber} at ${pr.head.sha} on ${pr.base.ref}.`);
