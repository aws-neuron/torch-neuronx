name: Lint

on:
  pull_request:
    branches: [main, 'contribute-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: [self-hosted, linux, "neuron.image:neuron-gate-tools", "neuron.run-${{ github.run_id }}-pre-commit"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # setup-python and pre-commit/action install on the host, but run steps
      # run in the gate container. Install and run pre-commit in the container.
      - run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m pip install pre-commit
          python3 -m pre_commit run --show-diff-on-failure --color=always --all-files
