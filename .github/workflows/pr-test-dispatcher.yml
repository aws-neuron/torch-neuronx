name: PR Test Dispatcher

# Manual trigger for internal developers to run tests on external PRs.
# Only users with write access to the repo can trigger this workflow.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (e.g. 42)'
        required: true
        type: string
      test_scope:
        description: 'smoke runs one device test file. full runs the ATen suite.'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch tests for PR #${{ github.event.inputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate and fetch PR info
        id: pr-info
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (isNaN(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: "${process.env.PR_NUMBER}"`);
              return;
            }

            console.log(`Fetching PR #${prNumber} ...`);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}, not open.`);
              return;
            }

            const headSha = pr.head.sha;
            console.log(`PR #${prNumber}: "${pr.title}"`);
            console.log(`  head sha : ${headSha}`);

            core.setOutput('head_sha', headSha);

      - name: Dispatch pull.yml
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          TEST_SCOPE: ${{ github.event.inputs.test_scope }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const headSha  = process.env.HEAD_SHA;
            const testScope = process.env.TEST_SCOPE || 'smoke';

            // Hardcode 'main' because the repo's default branch is 'develop',
            // but pull.yml lives on the 'main' branch.
            const dispatchRef = 'main';

            console.log(`Dispatching pull.yml on ref "${dispatchRef}" for PR #${prNumber} (sha: ${headSha}, scope: ${testScope})`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pull.yml',
              ref: dispatchRef,
              inputs: {
                pr_number: prNumber,
                head_sha: headSha,
                test_scope: testScope,
              },
            });

            console.log('✓ Successfully dispatched pull.yml');
