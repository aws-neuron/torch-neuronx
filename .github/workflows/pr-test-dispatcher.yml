name: PR Test Dispatcher

# Manual trigger for internal developers to run tests on external PRs.
# Only users with write access to the repo can trigger this workflow.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (e.g. 42)'
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch tests for PR #${{ github.event.inputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate and fetch PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}', 10);
            if (isNaN(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: "${{ github.event.inputs.pr_number }}"`);
              return;
            }

            console.log(`Fetching PR #${prNumber} ...`);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}, not open.`);
              return;
            }

            const headRef = pr.head.ref;
            const headSha = pr.head.sha;
            console.log(`PR #${prNumber}: "${pr.title}"`);
            console.log(`  head ref : ${headRef}`);
            console.log(`  head sha : ${headSha}`);

            core.setOutput('head_ref', headRef);
            core.setOutput('head_sha', headSha);

      - name: Dispatch pull.yml
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ github.event.inputs.pr_number }}';
            const headRef  = '${{ steps.pr-info.outputs.head_ref }}';
            const headSha  = '${{ steps.pr-info.outputs.head_sha }}';

            console.log(`Dispatching pull.yml for PR #${prNumber} on ref ${headRef} (${headSha})`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pull.yml',
              ref: headRef,
              inputs: {
                pr_number: prNumber,
                head_sha: headSha,
              },
            });

            console.log('✓ Successfully dispatched pull.yml');
