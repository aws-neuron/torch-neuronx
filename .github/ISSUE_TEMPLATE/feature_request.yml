name: Feature Request
description: Propose a new feature or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        #### Before you file a request, please check that it is not already a known limitation.

        - [Neuron release notes](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/release-notes/index.html)
          — known issues and limitations are listed per release
        - [Neuron troubleshooting guide](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/troubleshooting.html)
        - [Neuron runtime troubleshooting](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/neuron-runtime/nrt-troubleshoot.html)
        - [Neuron container troubleshooting](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/deploy/troubleshooting.html)
        - [PyTorch on Neuron documentation](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/frameworks/torch/index.html)
        - [Existing and past issues](https://github.com/aws-neuron/torch-neuronx/issues?q=is%3Aissue+sort%3Acreated-desc+)
  - type: textarea
    attributes:
      label: 🚀 Summary and Motivation
      description: >
        A clear and concise description of the feature proposal. Please outline
        the motivation — is your feature request related to a specific problem?
        If this is related to another GitHub issue, please link here too.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe how you'd like this to work.
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: A description of any alternative solutions or features you've considered, if any.
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request.
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
