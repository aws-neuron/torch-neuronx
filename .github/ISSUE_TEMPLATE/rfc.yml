name: RFC (Design Proposal)
description: Propose an cross-cutting/complex or high-impact change for design review before implementation
title: "[RFC] "
labels: [rfc]
body:
  - type: markdown
    attributes:
      value: |
        An RFC gets a design reviewed **before** the code is written, so that alternatives are still
        cheap to choose between — rather than after someone has spent two weeks on a large PR.

        **Open an RFC if the change is any of:**
        - Semantic changes to shared machinery — allocator, streams, events, execution
          engine, dispatcher, collectives. Blast radius is "every model", not "this op".
        - Cross-cutting changes that land in another area's code — e.g. a `torch.compile`
          requirement needing a change inside the caching allocator, or a distributed requirement
          that changes stream semantics. The reviewing team needs the design, not just the diff.
        - New public API or new environment variables, or a change to what an existing one means.
        - Behavioural changes that are hard to reverse — on-by-default changes, serialization
          formats, anything that becomes a compatibility commitment the moment it ships.
        - Deliberate performance/memory tradeoffs — "this costs a little X to buy safety in Y".
        - A fix with more than one plausible design, where picking one forecloses the others.

        **Not needed for:** bug fixes with one obvious correct form, new op coverage, tests, docs,
        behaviour-preserving refactors, or performance work transparent to callers. Send a normal PR.

        If you are unsure, open the RFC — it is much cheaper than a rejected PR.

        For full process of raising an RFC see:
        [Design Review (RFCs)](https://github.com/aws-neuron/torch-neuronx/blob/HEAD/CONTRIBUTING.md#design-review-rfcs).
  - type: textarea
    attributes:
      label: Summary
      description: Two or three sentences — what changes, and why.
    validations:
      required: true
  - type: input
    attributes:
      label: Affected areas
      description: e.g. allocator, streams, dispatcher, collectives, torch.compile, distributed
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation
      description: >
        What problem does this solve, and who hits it? If there is a bug, paste the actual error
        text and the configuration that produces it. If this is driven by another team's or a
        customer's requirement, say so. Cite files and line numbers for current behaviour.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Root cause
      description: >
        For bug-driven RFCs. Name the exact invariant that is violated and the code that should have
        maintained it. Distinguish what you MEASURED from what you INFERRED. If the same problem
        does not occur on PT-upstream or another backend, explain specifically why.
  - type: textarea
    attributes:
      label: Proposed change
      description: >
        The design. Paste the diff or pseudocode if it is small enough to read inline. Explain why
        it is correct in terms of the invariant above.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Precedent
      description: >
        Where does this mechanism already exist — elsewhere in this repo, upstream PyTorch, or
        another backend? Cite file/line or a PR link. A change that invents a new
        mechanism carries a much heavier burden of proof than one that ports an idiom the codebase
        already relies on. If there is genuinely no precedent, say so explicitly and explain why
        this case is novel — do not leave it unaddressed.
  - type: textarea
    attributes:
      label: Alternatives considered
      description: >
        What else could work, and why not? Alternatives you actually implemented and rejected on
        measurement are the strongest argument for your proposal — include them even when the
        result was unflattering. Also cover "do nothing": what does the workaround cost the user?
  - type: textarea
    attributes:
      label: Scope and limitations
      description: >
        What does this deliberately NOT cover? If it is a targeted fix or a heuristic rather than a
        general solution, say which case it handles and what remains unhandled. State this
        yourself — a limitation a reviewer discovers unprompted costs more trust than one you
        disclose.
  - type: textarea
    attributes:
      label: Evidence (hardware)
      description: >
        Measured results, not "this should fix it". Give the instance/pod type, torch-neuronx and
        neuronx-cc versions, relevant env vars, and the exact command. Prefer a same-binary A/B
        (one build, behaviour switched by env var) so the only variable is the change itself.
        Include performance and memory impact, not just correctness. For changes to allocation,
        lifetime, or caching, include evidence that nothing drifts over a long run — a short run
        cannot show the absence of a leak.
      placeholder: |
        Environment: trn2.48xlarge, torch-neuronx x.y.z, neuronx-cc a.b.c, env vars ...
        Command: ...
        Method: same-binary A/B OR arms selected by ENV_VAR

        | Arm | `<failure metric>` | Steps reached | mfu | tokens/sec | peak memory | exit |
        |---|---|---|---|---|---|---|
        | Fix |  |  |  |  |  |  |
        | Baseline |  |  |  |  |  |  |
  - type: textarea
    attributes:
      label: Risks and mitigations
      description: >
        What could this break, and how would you notice? Include the rollback story — is this
        behind a flag, and if not, why is that acceptable?
  - type: textarea
    attributes:
      label: Testing plan
      description: >
        Which existing tests cover this, and what new tests will the implementation add? Note any
        test that reproduces a race, since those tend to be flaky and should be marked as such.
  - type: textarea
    attributes:
      label: Open questions
      description: >
        Anything you want reviewers to decide. Submitting with open questions is expected — that is
        what review is for.
  - type: markdown
    attributes:
      value: >
        Thanks for writing this up! Tip: wrap placeholders in backticks (`` `<name>` ``) —
        bare angle brackets are parsed as HTML tags and vanish when rendered.
