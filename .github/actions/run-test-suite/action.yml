name: Run Test Suite
description: Run a test command, copy outputs, and upload artifacts.

inputs:
  test-command:
    description: The test command to run (e.g., "./tools/run-test-parallel tests/distributed")
    required: true
  artifact-name:
    description: Name for the uploaded artifact
    required: true
  checkout:
    description: "Whether to checkout the repo (set to 'false' if already checked out)"
    default: "false"
  artifact-path:
    description: "Path to upload as artifact (relative to workspace)"
    default: test-results/

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4

    - name: Run Test
      shell: bash
      run: |
        export TEST_COMMAND='${{ inputs.test-command }}'
        .github/actions/run-test-suite/run_test.sh

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        retention-days: 30
