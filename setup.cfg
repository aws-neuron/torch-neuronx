[tool:pytest]
testpaths = kaizen_test
addopts =
    --strict-config
    --tb=short
    --durations=10

[options]
# Enable type checking
check_format = True
test_mypy = True

[aliases]
test=brazil_test

# C++ unit test target using test_unit_suites_kaizen with C++ option
cpp_unit_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --cpp_unit_tests'

# test target that runs aten, dist tests within the package and sanity dist pt tests
# sync
unit_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --sanity_pt_distributed_tests'
# async
unit_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --sanity_pt_distributed_tests --async'

# aten test targets
# sync
aten_unit_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --skip-distributed --skip_pt_test_distributed'
aten_pytorch_upstream_unit_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/test_aten.py'
# async
aten_unit_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --skip-distributed --skip_pt_test_distributed --async'
aten_pytorch_upstream_unit_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/test_aten.py --async'

# torch eager dist unit test targets
# sync
dist_unit_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/distributed --num_workers 8'
# async
dist_unit_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/distributed --num_workers 8 --async'

# Distributed PT upstream test targets
# sync
dist_pt_dtensor_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_dtensor.py --num_workers 8'
dist_pt_dtensor_tp_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_dtensor_tp.py --num_workers 8'
dist_pt_fsdp_v1_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_fsdp.py --num_workers 16'
dist_pt_fsdp_v2_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/fsdp_v2/ --num_workers 8'
dist_pt_ddp_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_ddp.py --num_workers 8'
dist_pt_common_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_common_c10d.py --num_workers 8'
dist_pt_checkpoint_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_checkpoint.py --num_workers 8'
dist_pt_tests=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed --num_workers 8'
# async
dist_pt_dtensor_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_dtensor.py --num_workers 8 --async'
dist_pt_dtensor_tp_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_dtensor_tp.py --num_workers 8 --async'
dist_pt_fsdp_v1_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_fsdp.py --num_workers 16 --async'
dist_pt_fsdp_v2_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/fsdp_v2/ --num_workers 8 --async'
dist_pt_ddp_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_ddp.py --num_workers 8 --async'
dist_pt_common_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_common_c10d.py --num_workers 8 --async'
dist_pt_checkpoint_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed/test_checkpoint.py --num_workers 8 --async'
dist_pt_tests_async=brazil_test --addopts='-m "test_unit_suites_kaizen" --test_suite_path tests/pytorch_tests/distributed --num_workers 8 --async'
